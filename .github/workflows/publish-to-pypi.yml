name: Publish to PyPI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types: [closed]

jobs:
  publish:
    # 只在 PR merge 到 master 或直接 push 到 master 时运行
    if: github.event_name == 'push' || (github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    
    # 配置 OIDC 权限（用于 Trusted Publishers）
    permissions:
      id-token: write  # 必需：用于 OIDC 身份验证
      contents: read   # 必需：用于检出代码
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
        
    - name: Build package
      run: python -m build
      
    - name: Publish to PyPI using OIDC
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        # 使用 Trusted Publishers (OIDC)，无需配置 token
        # 需要在 PyPI 项目设置中预先配置 GitHub 作为 Trusted Publisher
        print-hash: true

