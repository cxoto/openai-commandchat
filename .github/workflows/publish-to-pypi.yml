name: Publish to PyPI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types: [closed]

jobs:
  publish:
    if: github.event_name == 'push' || (github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Check if version changed
      id: version_check
      run: |
        python -m pip install --upgrade pip
        pip install -r .github/scripts/requirements.txt
        python .github/scripts/check_version.py
      continue-on-error: true
    
    - name: Skip publish if version unchanged
      if: steps.version_check.outcome == 'failure'
      run: |
        echo "::warning::Version has not changed. Skipping PyPI publish."
        echo "To publish a new version, update the version field in pyproject.toml"
        exit 0
        
    - name: Install build dependencies
      if: steps.version_check.outcome == 'success'
      run: |
        python -m pip install --upgrade pip
        pip install build
        
    - name: Build package
      if: steps.version_check.outcome == 'success'
      run: python -m build
      
    - name: Publish to PyPI using OIDC
      if: steps.version_check.outcome == 'success'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        print-hash: true

